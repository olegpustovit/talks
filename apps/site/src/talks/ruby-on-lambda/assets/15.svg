<svg viewBox="0 0 800 640" role="img" aria-label="The constraints change the design"><g class="layer layer-0" style="--delay:0.0s"><text x="50" y="115" fill="var(--color-accent)" font-size="15" text-anchor="start">01</text><path class="ink" d="M110 90L720 90" fill="none" stroke="var(--color-muted)" stroke-width="0.7" opacity="1" pathLength="1"/><text x="120" y="135" fill="var(--color-accent)" font-size="30" text-anchor="start">Small payloads</text><text x="120" y="172" fill="var(--color-muted)" font-size="16" text-anchor="start">6 MB synchronous invocation · large files go to S3</text></g><g class="layer layer-1" style="--delay:0.16s"><text x="50" y="285" fill="var(--se-diagram-lavender)" font-size="15" text-anchor="start">02</text><path class="ink" d="M110 260L720 260" fill="none" stroke="var(--color-muted)" stroke-width="0.7" opacity="1" pathLength="1"/><text x="120" y="305" fill="var(--se-diagram-lavender)" font-size="30" text-anchor="start">Stateless compute</text><text x="120" y="342" fill="var(--color-muted)" font-size="16" text-anchor="start">Persist outside the runtime</text></g><g class="layer layer-2" style="--delay:0.32s"><text x="50" y="455" fill="var(--se-diagram-coral)" font-size="15" text-anchor="start">03</text><path class="ink" d="M110 430L720 430" fill="none" stroke="var(--color-muted)" stroke-width="0.7" opacity="1" pathLength="1"/><text x="120" y="475" fill="var(--se-diagram-coral)" font-size="30" text-anchor="start">Durable handoffs</text><text x="120" y="512" fill="var(--color-muted)" font-size="16" text-anchor="start">Queue work that must outlive the call</text></g></svg>
